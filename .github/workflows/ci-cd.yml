name: CI/CD - Aliyun ECS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Validate and test backend
        env:
          DEBUG: "0"
          SECRET_KEY: ci-only-secret-key
          ALLOWED_HOSTS: localhost,127.0.0.1
          WEB_SEARCH_ENABLED: "0"
          USE_HASH_EMBEDDINGS: "1"
        run: |
          python manage.py check
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      ALIYUN_HOST: ${{ vars.ALIYUN_HOST || '121.41.73.242' }}
      ALIYUN_USER: ${{ vars.ALIYUN_USER || 'root' }}
      ALIYUN_SSH_PORT: ${{ vars.ALIYUN_SSH_PORT || '22' }}
      ALIYUN_DEPLOY_PATH: ${{ vars.ALIYUN_DEPLOY_PATH || '/opt/medical-rag' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALIYUN_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Package release
        env:
          DEPLOY_ENV_FILE: ${{ secrets.ALIYUN_DEPLOY_ENV_FILE }}
        run: |
          if [[ -z "${DEPLOY_ENV_FILE//[[:space:]]/}" ]]; then
            echo "ALIYUN_DEPLOY_ENV_FILE is empty. Configure it in the production environment secrets." >&2
            exit 1
          fi
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude=.venv \
            --exclude=frontend/node_modules \
            --exclude=frontend/dist \
            --exclude=data \
            --exclude='*.sqlite3' \
            --exclude='*.pdf' \
            -czf "$RUNNER_TEMP/release-${GITHUB_SHA}.tar.gz" \
            -C "$GITHUB_WORKSPACE" .
          printf '%s' "$DEPLOY_ENV_FILE" > deployment.env
          chmod 600 deployment.env
      - name: Upload and deploy
        run: |
          remote_incoming="${ALIYUN_DEPLOY_PATH}/incoming/${GITHUB_SHA}"
          ssh -p "$ALIYUN_SSH_PORT" "$ALIYUN_USER@$ALIYUN_HOST" "mkdir -p '$remote_incoming'"
          scp -P "$ALIYUN_SSH_PORT" \
            "$RUNNER_TEMP/release-${GITHUB_SHA}.tar.gz" deployment.env scripts/deploy_aliyun.sh \
            "$ALIYUN_USER@$ALIYUN_HOST:$remote_incoming/"
          ssh -p "$ALIYUN_SSH_PORT" "$ALIYUN_USER@$ALIYUN_HOST" \
            "chmod 700 '$remote_incoming/deploy_aliyun.sh' && '$remote_incoming/deploy_aliyun.sh' '$ALIYUN_DEPLOY_PATH' '$GITHUB_SHA' '$remote_incoming/release-$GITHUB_SHA.tar.gz' '$remote_incoming/deployment.env'"